<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container mt-5">

    <h1 class="text-center mb-4">Tabela de Pedidos</h1>

    <table class="table table-bordered table-striped table-hover shadow">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nome do Cliente</th>
          <th>Email de Contato</th>
          <th>Produto</th>
          <th>Preço</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th scope="row">1</th>
          <td>Maria Silva</td>
          <td>maria@email.com</td>
          <td>Camiseta</td>
          <td>R$ 59,90</td>
        </tr>

        <tr>
          <th scope="row">2</th>
          <td>João Souza</td>
          <td>joao@email.com</td>
          <td>Calça Jeans</td>
          <td>R$ 129,90</td>
        </tr>

        <tr>
          <th scope="row">3</th>
          <td>Ana Costa</td>
          <td>ana@email.com</td>
          <td>Tênis</td>
          <td>R$ 199,90</td>
        </tr>
      </tbody>
    </table>

    <div class="card mt-5 shadow">
      <div class="card-body">
        <h2 class="mb-4">Formulário de Pedido</h2>

        <form id="formPedido">

          <div class="mb-3">
            <label for="nome" class="form-label">Nome do Cliente</label>
            <input 
              type="text" 
              class="form-control" 
              id="nome" 
              placeholder="Digite seu nome"
              required
            >
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="Digite seu email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="produto" class="form-label">Selecione o Produto</label>
            <select class="form-select" id="produto" required>
              <option value="">Escolha um produto</option>
              <option value="Camiseta">Camiseta</option>
              <option value="Calça Jeans">Calça Jeans</option>
              <option value="Tênis">Tênis</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">
            Enviar Pedido
          </button>

        </form>

        <div id="resultado" class="alert alert-success mt-4 d-none"></div>

      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById("formPedido");
    const resultado = document.getElementById("resultado");
    const tabela = document.querySelector("tbody");
  
    let contador = 4;
  
    form.addEventListener("submit", function(event) {
      event.preventDefault();
  
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const produto = document.getElementById("produto").value;
  
      let preco = "";
  
      if (produto === "Camiseta") {
        preco = "R$ 59,90";
      } else if (produto === "Calça Jeans") {
        preco = "R$ 129,90";
      } else if (produto === "Tênis") {
        preco = "R$ 199,90";
      }
  
      const novaLinha = `
        <tr>
          <th scope="row">${contador}</th>
          <td>${nome}</td>
          <td>${email}</td>
          <td>${produto}</td>
          <td>${preco}</td>
        </tr>
      `;
  
      tabela.innerHTML += novaLinha;
  
      resultado.classList.remove("d-none");
      resultado.innerHTML = `
        Pedido enviado com sucesso!
      `;
  
      form.reset();
  
      contador++;
    });
  </script>
